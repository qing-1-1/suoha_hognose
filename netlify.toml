[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
  included_files = ["index.html"]

[functions."auction-settle"]
  schedule = "* * * * *"

[functions."admin-notifications"]
  schedule = "* * * * *"

[functions."manual-payment"]
  external_node_modules = ["sharp", "tesseract.js", "tesseract.js-core", "@tesseract.js-data/eng"]
  included_files = ["netlify/functions/lib/payment-amount-worker.cjs", "node_modules/@tesseract.js-data/eng/4.0.0/eng.traineddata.gz"]

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/collection"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/specimens/*"
  to = "/.netlify/functions/specimen-page?slug=:splat"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
